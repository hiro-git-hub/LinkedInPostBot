# Wen willst du mit deinen Posts erreichen? Fließt in Scorer und Writer ein.
audience: >
  Entwickler:innen, Tech-Leads, Shop-Betreiber:innen und Entscheider:innen im DACH-Raum, die sich für
  Shopware, E-Commerce und KI in der Praxis interessieren – und für die gesellschaftlichen und politischen
  Folgen von Technik.

# Themenrahmen für den Scorer: nur was hier reinpasst, wird hoch bewertet.
topics: |
  - KI in der Softwareentwicklung (Coding-Agents, KI-gestützte Workflows, Dev-Tools, RAG-Architekturen)
  - E-Commerce und Shopware (Shops, Suche, Personalisierung, KI-Shopping-Agents, Plattform-Entwicklungen)
  - Übergreifende Tech-Entwicklungen mit Praxisfolgen (neue Modelle, Marktverschiebungen, Nutzerverhalten)
  - Politik: Digital-, Wirtschafts- und Gesellschaftspolitik, Regulierung (z.B. AI Act, Datenschutz, Verwaltungsdigitalisierung)
    und politische Entwicklungen, zu denen sich eine pointierte eigene Einordnung lohnt
  - Wissenschaft: neue Erkenntnisse und Studien, die überraschen, Alltag oder Technik betreffen oder
    gängige Annahmen widerlegen

language: de

# Modelle pro Rolle – Format "provider:model" (siehe langchain init_chat_model).
# Weitere Keys (z.B. reasoning_effort, temperature) werden direkt ans Modell durchgereicht.
# Hinweis: GPT-5-Reasoning-Modelle akzeptieren kein temperature – daher hier weggelassen.
models:
  scorer: {model: "openai:gpt-5-mini", reasoning_effort: low}
  selector: {model: "openai:gpt-5-mini", reasoning_effort: low}
  researcher: {model: "openai:gpt-5-mini", reasoning_effort: low}
  writer: {model: "openai:gpt-5", reasoning_effort: medium}
  critic: {model: "openai:gpt-5", reasoning_effort: low}
  hashtags: {model: "openai:gpt-5-mini", reasoning_effort: low}
  image_prompt: {model: "openai:gpt-5-mini", reasoning_effort: low}

# Bilder auf Knopfdruck (🖼️ in Telegram). Querformat passt am besten in den LinkedIn-Feed.
images:
  model: gpt-image-1
  size: 1536x1024
  quality: medium          # low | medium | high – beeinflusst die Kosten deutlich
  style: >
    Fotorealistisch im Stil hochwertiger Editorial-Fotografie (Wirtschafts- oder Tech-Magazin): echte Orte und
    Gegenstände, natürliches Licht, geringe Schärfentiefe, dezente, leicht entsättigte Farben, dokumentarische
    Anmutung. Keine gestellten Stockfoto-Szenen, keine in die Kamera lächelnden Menschen, keine Hologramme,
    kein Neon-Sci-Fi-Look, keine leuchtenden Gehirne oder Roboterhände. Menschen höchstens angeschnitten oder
    von hinten. Keine Schrift, keine Bildschirme mit lesbarem Text.

sources:
  # Anthropic & LangChain haben keinen funktionierenden Feed – werden über die Web-Recherche abgedeckt.
  rss:
    - https://openai.com/news/rss.xml
    - https://blog.google/technology/ai/rss/
    - https://huggingface.co/blog/feed.xml
    - https://github.blog/feed/
    - https://simonwillison.net/atom/everything/
    - https://www.heise.de/developer/rss/news-atom.xml
    - https://t3n.de/rss.xml
    # Politik
    - https://netzpolitik.org/feed/
    - https://www.tagesschau.de/inland/index~rss2.xml
    - https://newsfeed.zeit.de/politik/index
    # Wissenschaft
    - https://www.spektrum.de/alias/rss/spektrum-de-rss-feed/996406
    - https://www.tagesschau.de/wissen/index~rss2.xml
  hackernews:
    min_points: 150
    lookback_hours: 108   # deckt die längste Lücke zwischen zwei geplanten Läufen ab (Mi -> So)
    max_items: 20         # nur die meistdiskutierten Stories

limits:
  max_age_hours: 108    # ältere RSS-Einträge werden verworfen – passend zum Abstand der Läufe
  max_items_to_score: 100
  max_items_per_feed: 12  # je Feed nur die neuesten – sonst verdrängen Nachrichten-Feeds die Fachquellen
  min_relevance: 6      # darunter wird kein Post geschrieben
  shortlist_size: 5     # so viele Top-Themen bekommt der Selector zur Auswahl

# Geplante Läufe im `linkedin-bot serve`-Modus (Tage: mon, tue, wed, thu, fri, sat, sun)
schedule:
  timezone: Europe/Berlin
  runs:
    - {day: wed, time: "09:00"}
    - {day: sun, time: "18:00"}

linkedin:
  # true = freigegebene Posts werden nur archiviert, nicht veröffentlicht. Erst nach dem ersten Test auf false setzen.
  dry_run: false
  api_version: "202609"   # LinkedIn-Version: YYYYMM, jede Version wird ca. 1 Jahr unterstützt
  visibility: PUBLIC      # oder CONNECTIONS
  remind_days_before_expiry: 7
  comment_source: true    # Quell-Link automatisch als ersten Kommentar posten ("Link in den Kommentaren")

research:
  max_tool_calls: 5     # Web-Suchen + Seitenabrufe pro Recherche

writing:
  min_chars: 900
  max_chars: 1800
  max_revisions: 2      # so oft darf der Critic den Entwurf zurückschicken
  hook_max_lines: 2     # Hook = Text vor der ersten Leerzeile – mobil zeigt LinkedIn ~2 Zeilen vor "…mehr"
  hook_max_chars: 150
  # Abgenutzte Formulierungen – der Critic lässt keinen Entwurf durch, der eine davon enthält.
  banned_phrases:
    - Aber kurz von vorn
    - Lass uns eintauchen
    - Game-Changer
    - Es bleibt spannend
    - In diesem Sinne
    - Hier ist der Punkt
    - Stell dir vor
    - Hast du dich schon mal gefragt
    - Heute möchte ich
