[project]
name = "linkedin-bot"
version = "0.1.0"
description = "LangGraph-Pipeline: KI-/Dev-News -> LinkedIn-Post-Entwürfe"
readme = "README.md"
authors = [
    { name = "Jonas Fichtner", email = "jonas.fichtner@digitalwert.de" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pygments>=2.21.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[job-queue]>=22.8",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "trafilatura>=2.2.0",
]

[project.scripts]
linkedin-bot = "linkedin_bot.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
